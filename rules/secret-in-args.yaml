id: secret-in-args
title: Secret in command arguments
severity: critical
applies_to: servers
check: secret-args
why: 'Arguments are visible in process listings and logs, and the config file is often shared.'
fix: 'Read the secret from an environment variable the server supports, referenced as "${env:NAME}", and rotate the exposed key.'
references: [https://modelcontextprotocol.io/specification]
fixtures:
  fail:
    - { file: mcp.json, config: { mcpServers: { s: { command: npx, args: ["--token", "ghp_EXAMPLEexampleEXAMPLEexample0000"] } } } }
  pass:
    - { file: mcp.json, config: { mcpServers: { s: { command: npx, args: ["--token", "${env:GITHUB_TOKEN}"] } } } }
