id: secret-in-url
title: Secret in URL
severity: high
applies_to: servers
check: secret-url
why: 'URLs end up in logs, history and shared configs, so a credential in one is easily exposed.'
fix: 'Remove credentials from the URL and send them in a header referenced from an input or env variable, then rotate the exposed key.'
references: [https://modelcontextprotocol.io/specification]
fixtures:
  fail:
    - { file: mcp.json, config: { mcpServers: { s: { url: "https://user:pass123456789@example.com/mcp" } } } }
  pass:
    - { file: mcp.json, config: { mcpServers: { s: { url: "https://example.com/mcp" } } } }
