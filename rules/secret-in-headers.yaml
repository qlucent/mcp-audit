id: secret-in-headers
title: Secret in headers
severity: high
applies_to: servers
check: secret-headers
why: 'A plaintext credential in a header leaks with the config file and grants access to the remote server.'
fix: 'Reference the secret instead, e.g. "Authorization": "Bearer ${input:token}" (VS Code) or an env reference, and rotate the exposed key.'
references: [https://modelcontextprotocol.io/specification]
fixtures:
  fail:
    - { file: mcp.json, config: { mcpServers: { s: { url: "https://example.com/mcp", headers: { Authorization: "Bearer ghp_EXAMPLEexampleEXAMPLEexample0000" } } } } }
  pass:
    - { file: mcp.json, config: { mcpServers: { s: { url: "https://example.com/mcp", headers: { Authorization: "Bearer ${input:token}" } } } } }
