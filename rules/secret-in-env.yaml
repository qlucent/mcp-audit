id: secret-in-env
title: Secret in env block
severity: critical
applies_to: servers
check: secret-env
why: 'Config files get committed, synced and shared; a plaintext credential here leaks with them.'
fix: 'Pass the variable through from the environment instead, e.g. "GITHUB_TOKEN": "${env:GITHUB_TOKEN}" (VS Code) or the client''s env passthrough, and rotate the exposed key.'
references: [https://modelcontextprotocol.io/specification]
fixtures:
  fail:
    - { file: mcp.json, config: { mcpServers: { s: { command: npx, env: { GITHUB_TOKEN: "ghp_EXAMPLEexampleEXAMPLEexample0000" } } } } }
  pass:
    - { file: mcp.json, config: { mcpServers: { s: { command: npx, env: { PATH: "/usr/local/bin:/usr/bin:/bin" } } } } }
    - { file: mcp.json, config: { mcpServers: { s: { command: npx, env: { GITHUB_TOKEN: "${env:GITHUB_TOKEN}" } } } } }
